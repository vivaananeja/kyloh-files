<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kyloh Files</title>
    <meta
      name="description"
      content="Kyloh Files: globally synced countdown to 3:00 PM IST."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Roboto+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-0: #090a0d;
        --bg-1: #111319;
        --bg-2: #1b1e27;
        --text: #f1f1f1;
        --muted: #666b77;
        --line: rgba(255, 255, 255, 0.14);
        --card-edge: rgba(216, 223, 235, 0.12);
        --live: #ff4b4b;
        --sep-col: clamp(30px, 4vw, 52px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        overflow-x: hidden;
        color: var(--text);
        font-family: "Roboto Mono", monospace;
        background:
          radial-gradient(circle at center, rgba(77, 97, 143, 0.17) 0%, rgba(77, 97, 143, 0) 48%),
          radial-gradient(circle at center, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0) 70%),
          linear-gradient(165deg, #0a0b0f 0%, #14161d 100%);
      }

      .rings {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: repeating-radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.02) 0,
          rgba(255, 255, 255, 0.02) 2px,
          rgba(255, 255, 255, 0) 14px,
          rgba(255, 255, 255, 0) 24px
        );
        opacity: 0.2;
      }

      .shell {
        position: relative;
        z-index: 5;
        width: min(1160px, 94vw);
        padding: 1.8rem 0.8rem 2rem;
        text-align: center;
      }

      .edge-stickers {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .sticker {
        position: absolute;
        opacity: 0.95;
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
        mix-blend-mode: multiply;
        user-select: none;
      }

      .sticker.troll {
        top: 5vh;
        left: 2vw;
        width: clamp(82px, 11vw, 170px);
        transform: rotate(-8deg);
      }

      .sticker.cat-a {
        top: 9vh;
        right: 3vw;
        width: clamp(88px, 12vw, 180px);
        transform: rotate(7deg);
      }

      .sticker.cat-b {
        bottom: 7vh;
        left: 3vw;
        width: clamp(92px, 12vw, 180px);
        transform: rotate(-6deg);
      }

      .sticker.sixty-seven {
        bottom: 6vh;
        right: 3vw;
        width: clamp(70px, 9vw, 145px);
        transform: rotate(9deg);
      }

      .sticker.cry-laugh {
        top: 44vh;
        right: 1.5vw;
        width: clamp(66px, 8vw, 130px);
        transform: rotate(-12deg);
      }

      .live {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin-bottom: 0.9rem;
        color: var(--muted);
        font-size: clamp(0.62rem, 1.6vw, 0.78rem);
        letter-spacing: 0.52em;
        text-transform: uppercase;
      }

      .live-dot {
        width: 0.52rem;
        height: 0.52rem;
        border-radius: 50%;
        background: var(--live);
        box-shadow: 0 0 12px rgba(255, 75, 75, 0.9);
        animation: pulse 1.8s ease-out infinite;
      }

      h1 {
        margin: 0;
        font-family: "Bebas Neue", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-size: clamp(3.3rem, 13vw, 10.2rem);
        line-height: 0.9;
        color: #ededee;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.32);
      }

      .title-rule {
        width: min(560px, 80vw);
        height: 1px;
        margin: 2.1rem auto 2.3rem;
        background: linear-gradient(90deg, transparent, var(--line), transparent);
      }

      .timer-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(--sep-col) minmax(0, 1fr) var(--sep-col) minmax(0, 1fr);
        align-items: center;
        gap: clamp(0.6rem, 2vw, 1.3rem);
        max-width: 1400px;
        margin: 0 auto;
      }

      .time-card {
        width: clamp(220px, 24vw, 360px);
        aspect-ratio: 1 / 1;
        border: 1px solid var(--card-edge);
        border-radius: 20px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0) 38%),
          linear-gradient(180deg, var(--bg-2), var(--bg-1));
        box-shadow: inset 0 0 24px rgba(255, 255, 255, 0.03), 0 0 16px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        display: grid;
        place-items: center;
        position: relative;
      }

      .digits {
        font-family: "Anton", sans-serif;
        font-size: clamp(4.9rem, 10vw, 8.7rem);
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0.01em;
        color: #ededee;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.05);
      }

      .separator {
        font-family: "Teko", sans-serif;
        font-size: clamp(4rem, 9vw, 7.5rem);
        line-height: 1;
        color: rgba(189, 195, 207, 0.3);
        transform: translateY(-8px);
      }

      .time-unit {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.9rem;
        justify-self: center;
      }

      .label {
        color: var(--muted);
        font-size: clamp(0.7rem, 1.7vw, 0.95rem);
        letter-spacing: 0.44em;
        text-transform: uppercase;
        text-align: center;
      }

      .footer {
        margin-top: 2.5rem;
      }

      .classified {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        color: var(--muted);
        letter-spacing: 0.36em;
        font-size: clamp(0.64rem, 1.6vw, 0.85rem);
        text-transform: uppercase;
      }

      .classified::before,
      .classified::after {
        content: "";
        width: clamp(56px, 10vw, 86px);
        height: 1px;
        background: rgba(255, 255, 255, 0.2);
      }

      .social {
        margin-top: 0.65rem;
        display: flex;
        justify-content: center;
        gap: 1.15rem;
      }

      .icon-link {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        color: rgba(226, 231, 241, 0.64);
        border-radius: 8px;
        transition: color 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
      }

      .icon-link:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.08);
        transform: translateY(-2px);
      }

      .icon {
        width: 30px;
        height: 30px;
        display: block;
      }

      #reveal-screen {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: #000;
        display: none;
      }

      #reveal-screen.active {
        display: block;
      }

      #reveal-screen video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #reveal-screen.done video {
        display: none;
      }

      #lore-screen {
        position: fixed;
        inset: 0;
        z-index: 55;
        display: none;
        background:
          radial-gradient(900px 500px at 50% 30%, rgba(85, 106, 150, 0.26), transparent 70%),
          linear-gradient(160deg, #0b0d12, #111620);
        color: #e9edf5;
      }

      #lore-screen.active {
        display: grid;
        grid-template-rows: 1fr auto;
      }

      .lore-hero {
        position: relative;
        display: grid;
        align-items: end;
        justify-items: start;
        padding: 2rem;
      }

      .lore-corners::before,
      .lore-corners::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        border: 1px solid rgba(223, 233, 255, 0.28);
      }

      .lore-corners::before {
        top: 18px;
        left: 18px;
        border-right: 0;
        border-bottom: 0;
      }

      .lore-corners::after {
        top: 18px;
        right: 18px;
        border-left: 0;
        border-bottom: 0;
      }

      .lore-name {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.75rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #9da8bc;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 9px;
        padding: 0.45rem 0.7rem;
      }

      .lore-name .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff4545;
      }

      .lore-figure {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        opacity: 0.85;
        user-select: none;
      }

      .lore-figure-media {
        width: clamp(180px, 32vw, 420px);
        display: grid;
        place-items: center;
      }

      .lore-figure-media img {
        max-width: 100%;
        max-height: 52vh;
        object-fit: contain;
      }

      .lore-figure-text {
        text-align: center;
        font-size: clamp(3.6rem, 10vw, 9rem);
        line-height: 1.1;
        font-family: "Bebas Neue", sans-serif;
        letter-spacing: 0.08em;
        color: rgba(231, 236, 247, 0.92);
        display: none;
      }

      .lore-panel {
        background: rgba(8, 11, 17, 0.94);
        border-top: 1px solid rgba(225, 233, 255, 0.16);
        padding: 1rem 1.4rem 1.2rem;
      }

      .lore-copy {
        margin: 0;
        font-size: clamp(0.86rem, 1.6vw, 1.02rem);
        letter-spacing: 0.03em;
        color: #d8dfee;
      }

      .lore-actions {
        margin-top: 0.8rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
      }

      .lore-btn {
        appearance: none;
        border: 1px solid rgba(207, 218, 243, 0.27);
        background: rgba(255, 255, 255, 0.03);
        color: #dce4f7;
        border-radius: 8px;
        padding: 0.46rem 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.68rem;
        cursor: pointer;
      }

      .lore-btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      @media (max-width: 800px) {
        .timer-row {
          grid-template-columns: 1fr;
          gap: 0.75rem;
        }

        .separator {
          display: none;
        }

        .time-card {
          width: min(100%, 320px);
          aspect-ratio: 1 / 1;
          border-radius: 16px;
        }

        .sticker.troll,
        .sticker.cat-a {
          display: none;
        }

        .sticker.cry-laugh {
          right: 2vw;
          top: 5vh;
        }
      }

      @keyframes pulse {
        0% {
          opacity: 0.95;
          transform: scale(0.9);
        }
        75% {
          opacity: 0;
          transform: scale(1.45);
        }
        100% {
          opacity: 0;
          transform: scale(1.45);
        }
      }
    </style>
  </head>
  <body>
    <div class="rings" aria-hidden="true"></div>
    <div class="edge-stickers" aria-hidden="true">
      <img class="sticker troll" src="tow-mater.png" alt="" />
      <img class="sticker cat-a" src="cat-face.png" alt="" />
      <img class="sticker cat-b" src="cat-point.png" alt="" />
      <img class="sticker sixty-seven" src="67.png" alt="" />
      <img class="sticker cry-laugh" src="cry-laugh.jpeg" alt="" />
    </div>

    <main class="shell">
      <div class="live" aria-label="Live countdown">
        <span class="live-dot" aria-hidden="true"></span>
        <span>Live</span>
      </div>

      <h1>Kyloh Files</h1>
      <div class="title-rule" aria-hidden="true"></div>

      <section class="timer-row" aria-label="Countdown to 3:00 PM IST">
        <div class="time-unit">
          <article class="time-card">
            <div id="hours" class="digits">--</div>
          </article>
          <div class="label">Hours</div>
        </div>
        <div class="separator" aria-hidden="true">:</div>
        <div class="time-unit">
          <article class="time-card">
            <div id="minutes" class="digits">--</div>
          </article>
          <div class="label">Minutes</div>
        </div>
        <div class="separator" aria-hidden="true">:</div>
        <div class="time-unit">
          <article class="time-card">
            <div id="seconds" class="digits">--</div>
          </article>
          <div class="label">Seconds</div>
        </div>
      </section>

      <footer class="footer">
        <div class="classified">Classified</div>
        <nav class="social" aria-label="External links">
          <a
            class="icon-link"
            href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="YouTube link"
            title="YouTube"
          >
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path
                d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.4 31.4 0 0 0 0 12a31.4 31.4 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.4 31.4 0 0 0 24 12a31.4 31.4 0 0 0-.5-5.8ZM9.6 15.6V8.4L16 12l-6.4 3.6Z"
              />
            </svg>
          </a>

          <a
            class="icon-link"
            href="https://www.ferrari.com/en-EN/auto/812-competizione?_gl=1*552vu8*_gcl_au*NDkzOTYzNzIyLjE3Njk2MTMyNTg.*_ga*MTA5NTYxMTg4Ni4xNzY5NjEzMjUz*_ga_JM1HT9B412*czE3NzA1NzgwMDgkbzMkZzEkdDE3NzA1NzgwMjQkajQ0JGwwJGgxNjY4MTE1MTY."
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Ferrari link"
            title="Ferrari"
          >
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10.5 13.5 13.5 10.5" />
              <path d="M7.1 16.9a4 4 0 0 1 0-5.7l2.2-2.2a4 4 0 0 1 5.7 0" />
              <path d="M16.9 7.1a4 4 0 0 1 0 5.7l-2.2 2.2a4 4 0 0 1-5.7 0" />
            </svg>
          </a>
        </nav>
      </footer>
    </main>

    <section id="reveal-screen" aria-label="Reveal video">
      <video id="reveal-video" preload="auto" playsinline>
        <source src="rickroll.mp4" type="video/mp4" />
      </video>
    </section>

    <section id="lore-screen" aria-label="Classified interaction">
      <div class="lore-hero lore-corners">
        <div class="lore-figure" aria-hidden="true">
          <div id="lore-figure-media" class="lore-figure-media">
            <img
              id="lore-sahur-image"
              src="Tung-Tung-Tung-Sahur-PNG-Photos.png"
              alt="Tung Tung Tung Sahur"
            />
          </div>
          <div id="lore-figure-text" class="lore-figure-text">THE<br />VIEWER</div>
        </div>
        <div class="lore-name"><span class="status-dot"></span><span id="lore-name">Tung Tung Tung Sahur</span></div>
      </div>
      <div class="lore-panel">
        <p id="lore-copy" class="lore-copy">Tung Tung Tung Sahur here. Kyloh Files are under review.</p>
        <div class="lore-actions">
          <button id="btn-continue" class="lore-btn" type="button">Continue</button>
        </div>
      </div>
    </section>

    <script>
      // Global countdown to 3:00 PM IST (Asia/Kolkata), same for everyone.
      const IST_OFFSET_MS = 5.5 * 60 * 60 * 1000;
      const DAY_MS = 24 * 60 * 60 * 1000;
      const TARGET_IST_MS_IN_DAY = 15 * 60 * 60 * 1000; // 3:00 PM
      const LOCK_KEY = "kyloh_lock_screen_v1";
      const loreScript = [
        "Tung Tung Tung Sahur here. Kyloh Files are under review.",
        "I checked every file and the evidence is complete.",
        "Verdict: Kyloh has no swag. This is now confirmed.",
        "Brace yourselves."
      ];

      const nodes = {
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds"),
      };
      const revealScreen = document.getElementById("reveal-screen");
      const revealVideoEl = document.getElementById("reveal-video");
      const loreScreen = document.getElementById("lore-screen");
      const loreCopy = document.getElementById("lore-copy");
      const loreName = document.getElementById("lore-name");
      const loreFigureMedia = document.getElementById("lore-figure-media");
      const loreFigureText = document.getElementById("lore-figure-text");
      const btnContinue = document.getElementById("btn-continue");

      const pad = (n) => String(n).padStart(2, "0");
      let revealed = false;
      let loreActive = false;
      let loreStep = 0;

      function getMsUntil3PmIst() {
        const nowIstMs = Date.now() + IST_OFFSET_MS;
        let msIntoIstDay = nowIstMs % DAY_MS;
        if (msIntoIstDay < 0) msIntoIstDay += DAY_MS;
        return TARGET_IST_MS_IN_DAY - msIntoIstDay;
      }

      function lockToBlackScreen() {
        try {
          localStorage.setItem(LOCK_KEY, "1");
        } catch (_) {}
        revealScreen.classList.add("active", "done");
        loreScreen.classList.remove("active");
      }

      function setCharacter(name) {
        loreName.textContent = "Tung Tung Tung Sahur";
        loreFigureMedia.style.display = "grid";
        loreFigureText.style.display = "none";
      }

      function openLoreScreen() {
        if (loreActive) return;
        loreActive = true;
        loreStep = 0;
        setCharacter("sahur");
        loreCopy.textContent = loreScript[0];
        btnContinue.textContent = "Continue";
        loreScreen.classList.add("active");
      }

      function revealVideo() {
        if (revealed) return;
        revealed = true;
        loreScreen.classList.remove("active");
        revealScreen.classList.add("active");
        revealVideoEl.currentTime = 0;
        revealVideoEl.controls = false;
        revealVideoEl.loop = false;
        revealVideoEl.muted = false;

        const tryPlay = revealVideoEl.play();

        if (tryPlay && typeof tryPlay.catch === "function") {
          tryPlay.catch(() => {
            // Autoplay with audio may be blocked; fallback to muted playback.
            revealVideoEl.muted = true;
            revealVideoEl.play().catch(() => {
              lockToBlackScreen();
            });
          });
        }
      }

      btnContinue.addEventListener("click", () => {
        loreStep += 1;
        if (loreStep >= loreScript.length) {
          revealVideo();
          return;
        }
        loreCopy.textContent = loreScript[loreStep];
        btnContinue.textContent = loreStep === loreScript.length - 1 ? "Reveal Kyloh Files" : "Continue";
      });

      revealVideoEl.addEventListener("ended", lockToBlackScreen);
      revealVideoEl.addEventListener("error", lockToBlackScreen);

      const wasLocked = (() => {
        try {
          return localStorage.getItem(LOCK_KEY) === "1";
        } catch (_) {
          return false;
        }
      })();

      if (wasLocked) {
        lockToBlackScreen();
      }

      function render() {
        if (wasLocked) return;
        const remaining = getMsUntil3PmIst();

        if (remaining <= 0) {
          openLoreScreen();
          return;
        }

        const totalSeconds = Math.floor(remaining / 1000);

        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        nodes.hours.textContent = pad(hours);
        nodes.minutes.textContent = pad(minutes);
        nodes.seconds.textContent = pad(seconds);
      }

      render();
      setInterval(render, 1000);
    </script>
  </body>
</html>
